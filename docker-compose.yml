version: "3.8"

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: myappdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  app:
    build: .
    container_name: windows-app
    ports:
      - "8084:8084"
    depends_on:
      mysql-db:
        condition: service_healthy  # Ye magic line!
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/myappdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

volumes:
  mysql-data:
